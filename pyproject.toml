[project]
name = "telco-churn"
version = "0.1.0"
description = "Previsão de churn com camada de decisão por valor esperado e dashboard público"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "joblib>=1.4",
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
    "streamlit>=1.38",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telco_churn"]

[tool.ruff]
line-length = 100
# O notebook de EDA é narrativa exploratória, não código de produção: as regras
# de estilo aqui só produziriam ruído (comentários longos em prosa, imports na
# ordem em que a análise precisou deles). O que é implantado vive em src/.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
